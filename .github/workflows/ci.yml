name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # macOS and Linux were already exercised by hand every pass; this makes it
  # automatic and pins the minimum supported interpreter (3.9), which is the
  # version the installed agent actually runs under on a stock macOS box and
  # has historically been where dev-python-only defects hide.
  posix:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip pytest
      - name: Test suite
        run: python -m pytest tests/ -q
      - name: selftest.py (real detection logic on this machine)
        run: python selftest.py

  # The point of this file. Until now no line of the Windows code had ever
  # executed on Windows: the parsers were tested against captured output and the
  # registry plumbing against an injected fake `winreg`. This job runs the real
  # thing on a real Windows kernel.
  windows:
    name: windows-latest / py${{ matrix.python }}
    runs-on: windows-latest
    # Process spawning is far more expensive here than on POSIX, and the live
    # harness additionally runs two full scans against the real machine (which
    # classify real binaries through real PowerShell). Headroom, not a target:
    # the suite itself should finish in minutes now that fixture files no
    # longer each cost an Authenticode probe.
    #
    # Cut from 60 to 30 after a run wedged in the wild: both Windows jobs
    # reported every step complete, then never finalized — no logs uploaded, the
    # run's own updated_at frozen at its start. That is a stall in the runner's
    # post-job phase, which no per-step timeout can reach, so the JOB cap is the
    # only bound on it. Observed healthy duration is ~13 min, so 30 keeps better
    # than 2x headroom while halving how long a stall can hold a branch.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip pytest
      # Per-step caps bound the OTHER hang: a single probe blocking forever
      # (a PowerShell child that never returns, a schtasks call waiting on a
      # lock). Without them one wedged probe consumes the whole job budget and
      # the log says only "in progress", which is the least useful failure a CI
      # run can produce. Each is well above the observed duration for that step.
      - name: Test suite
        timeout-minutes: 20
        run: python -m pytest tests/ -q
      - name: selftest.py (real detection logic on this machine)
        timeout-minutes: 5
        run: python selftest.py
      - name: Live Windows harness (real registry, schtasks, CIM, Authenticode)
        timeout-minutes: 20
        # `always()`: this harness is the only evidence that the Windows code
        # works on Windows, so a suite failure must not hide it. It reports its
        # own pass/fail and still fails the job on its own terms.
        if: always()
        env:
          AEGIS_WIN_LIVE: "1"
        run: python tests/win_live_harness.py
